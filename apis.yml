aid: bretton
name: Bretton
description: Bretton AI (formerly Greenlite AI) is a San Francisco fintech building AI-native operational
  infrastructure for financial institutions' back-office and financial-crime-compliance workflows. Its
  audit-ready AI agents automate AML alert investigation, KYC/CDD/EDD, sanctions screening, and transaction
  monitoring inside a bank's existing systems, replacing traditional BPO with agentic automation backed
  by QA/QC and full audit trails. The platform ships 30+ pre-built skills, 180+ data sources, a natural-language
  agent builder, and native connectors to core banking, document review, and compliance systems. Bretton
  is used by OCC-, FDIC-, and Federal Reserve-regulated banks and platforms including Robinhood, Mercury,
  Gusto, Lead Bank, and Coastal Community Bank, and raised a $75M Series B led by Sapphire Ventures (with
  Greylock, Thomson Reuters Ventures, and Canvas Ventures) in February 2026. The developer documentation
  portal is access-gated and there is no public API.
